name: Bug report
description: Report a problem in tux-letter
title: "bug: "
labels: ["type:fix"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - architecture
        - config
        - scraper
        - ai
        - newsletter
        - service
        - mail
        - state
        - aur
        - docs
        - ci
        - other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Something isn't working
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
      placeholder: Describe the expected result.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
      placeholder: Describe the observed result.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste any error messages, stack traces, or screenshots.
      render: shell

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Share relevant environment details.
      placeholder: |
        OS:
        tux-letter version / commit:
        Go version:
        Config:

  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      description: Confirm this report does not include secrets.
      options:
        - label: I have not included API keys, SMTP passwords or private email addresses.
          required: true
