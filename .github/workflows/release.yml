name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate semver tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unsupported tag format: $tag" >&2
            exit 1
          fi
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      - name: Ensure tag commit is on release branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
            echo "Tag ${GITHUB_REF_NAME} is not reachable from origin/release" >&2
            exit 1
          fi

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

  build:
    needs:
      - validate
      - test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archive
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="tux-letter_${VERSION}_linux_${GOARCH}"
          package_dir="dist/${name}"
          mkdir -p "$package_dir"
          commit="$(git rev-parse --short "$GITHUB_SHA")"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          version_pkg="github.com/kristyancarvalho/tux-letter/internal/version"
          go build -trimpath \
            -ldflags="-s -w -X ${version_pkg}.Version=${VERSION} -X ${version_pkg}.Commit=${commit} -X ${version_pkg}.Date=${build_date}" \
            -o "$package_dir/tux-letter" ./cmd/tux-letter
          cp LICENSE README.md "$package_dir/"
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          rm -rf "$package_dir"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: tux-letter-linux-${{ matrix.goarch }}
          path: dist/tux-letter_${{ needs.validate.outputs.version }}_linux_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  checksums:
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate source archive
        shell: bash
        run: scripts/release/source-archive.sh "${{ needs.validate.outputs.version }}" "$GITHUB_SHA" dist

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: tux-letter-checksums
          path: dist/checksums.txt
          if-no-files-found: error

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: tux-letter-source
          path: dist/tux-letter-${{ needs.validate.outputs.version }}-src.tar.gz
          if-no-files-found: error

  release:
    needs:
      - validate
      - checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/release-notes.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "tux-letter ${GITHUB_REF_NAME}" \
              --verify-tag \
              --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "tux-letter ${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes
          fi
